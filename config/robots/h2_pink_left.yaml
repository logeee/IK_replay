# PINK 微分 IK 控制器参数 —— H2 左臂（7 DoF，固定基座于 torso_link）。
# 说明见 h2_pink_right.yaml；左右仅 URDF、腕 frame 与关节名不同。

model:
  urdf_path: assets/robots/h2/arm/h2_left_arm_visual.urdf
  root_frame: torso_link
  wrist_frame: left_wrist_yaw_link
  controlled_joints:
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - left_wrist_pitch_joint
    - left_wrist_yaw_joint

pink:
  qp_solver: daqp
  position_cost: 20.0
  orientation_cost: 5.0
  frame_gain: 0.5
  frame_lm_damping: 0.001
  posture_cost: 0.05
  damping_cost: 0.001
  qp_damping: 1.0e-8
  max_joint_velocity_rad_s: 1.5
  joint_limit_policy: WARN

tracker:
  trajectory_preview_s: 0.0667
  predictor_history: 8
  root_prediction:
    mode: FILTERED_PREDICTION
    horizon_s: 0.0667
    twist_filter:
      enabled: true
      time_constant_s: 0.10
    clamp:
      linear_velocity_m_s: 0.5
      angular_velocity_rad_s: 1.5

# 18001 执行层接入参数（adapters/reach/execution_pink.py）。
execution:
  # 喂给 PINK 的反馈状态：
  #   internal —— PINK 积分自己上一拍的 q_target（推荐；与同事真机验证语义一致，
  #               执行器 H2ArmController 只是限速低通跟随）。
  #   command  —— 执行器当前指令角；measured —— 实测角。
  #   后两者在执行器限速远低于 PINK 上限时会让 QP 每拍饱和、终点附近极限环振荡。
  feedback: internal
  # 执行器落后 PINK 目标超过此值（rad）→ 故障保持，从执行器状态重规划
  executor_lag_fault_rad: 0.25
  # 到位后在世界系保持并测终态误差的时长（s）
  hold_s: 1.0
