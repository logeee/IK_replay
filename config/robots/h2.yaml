robot:
  name: h2
  display_name: H2 示例机器人
  urdf_path: assets/robots/h2/robot.urdf
  mesh_root: assets/robots/h2

chains:
  right_arm:
    display_name: 画面左侧手臂
    subtitle: 机器人右臂 / right_arm
    panel_side: left
    base_link: torso_link
    end_link: right_wrist_yaw_link
    target_visual_link: right_wrist_yaw_link
    joints:
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
    display_links:
      - torso_link
      - right_shoulder_pitch_link
      - right_shoulder_roll_link
      - right_shoulder_yaw_link
      - right_elbow_link
      - right_wrist_roll_link
      - right_wrist_pitch_link
      - right_wrist_yaw_link

  left_arm:
    display_name: 画面右侧手臂
    subtitle: 机器人左臂 / left_arm
    panel_side: right
    base_link: torso_link
    end_link: left_wrist_yaw_link
    target_visual_link: left_wrist_yaw_link
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
    display_links:
      - torso_link
      - left_shoulder_pitch_link
      - left_shoulder_roll_link
      - left_shoulder_yaw_link
      - left_elbow_link
      - left_wrist_roll_link
      - left_wrist_pitch_link
      - left_wrist_yaw_link
      - left_hand_link

# 静态标注 frame：挂在指定 link 上随 FK 一起动，只影响显示。
# 双相机位姿来自 hand_eye_2D 棋盘格标定（2026-09-02），均以
# torso_link 为基坐标系；视锥使用各相机同次采集时由 SDK 保存的 RGB 内参。
viewer_frames:
  - name: head_camera
    link: torso_link
    T:
      - [0.02879387565185726, -0.04714300236767688, 0.9984730592523303, 0.06963406908528419]
      - [-0.9995005699183863, 0.01165314614573773, 0.02937371133728094, 0.019742707677149224]
      - [-0.013020117425170064, -0.9988201747625377, -0.04678391849308369, 0.6525636941316227]
      - [0.0, 0.0, 0.0, 1.0]
    axis_length: 0.1
    frustum:
      fx: 1034.64794921875
      fy: 1034.5360107421875
      cx: 967.5718994140625
      cy: 537.5664672851562
      width: 1920
      height: 1080
      depth: 0.5
    color: "#bf7fff"

  - name: waist_camera
    link: torso_link
    T:
      - [0.03197599585990396, -0.6864364423235, 0.7264864391983026, 0.12222523394540422]
      - [-0.9993018053985412, -0.007903236433697568, 0.03651630568783244, 0.03189652649872919]
      - [-0.019324528868293278, -0.7271468555279152, -0.6862098899607045, -0.005765067350486153]
      - [0.0, 0.0, 0.0, 1.0]
    axis_length: 0.1
    frustum:
      fx: 607.7833251953125
      fy: 607.7333984375
      cx: 643.72509765625
      cy: 402.86041259765625
      width: 1280
      height: 800
      depth: 0.5
    color: "#38d9a9"

tcp:
  default:
    offset_xyz: [0.08, 0.0, 0.0]
    offset_rpy: [0.0, 0.0, 0.0]

initial_joints:
  right_arm:
    right_shoulder_pitch_joint: 0.2
    right_shoulder_roll_joint: -0.25
    right_shoulder_yaw_joint: 0.0
    right_elbow_joint: 0.9
    right_wrist_roll_joint: 0.0
    right_wrist_pitch_joint: -0.1
    right_wrist_yaw_joint: 0.0
  left_arm:
    left_shoulder_pitch_joint: 0.2
    left_shoulder_roll_joint: 0.25
    left_shoulder_yaw_joint: 0.0
    left_elbow_joint: 0.9
    left_wrist_roll_joint: 0.0
    left_wrist_pitch_joint: -0.1
    left_wrist_yaw_joint: 0.0

collision:
  enabled: true
  near_margin_m: 0.05
  # 躯干横截面接近圆角矩形：用两个相交的窄盒组成十字形近似，削掉单一
  # 大盒的四个外角。肩部胶囊从这些角附近经过，保留方角会把真机已经
  # 到达过的安全姿态误判成自碰；两个盒只把每状态的身体配对从 2×4
  # 增到 3×4，远小于 FK/IK 和 RRT 采样本身的开销。
  body:
    - name: torso_side_core
      kind: box
      link: torso_link
      xyz: [0.0, 0.0, 0.22]
      rpy: [0.0, 0.0, 0.0]
      half_extents: [0.075, 0.095, 0.25]
    - name: torso_front_back_core
      kind: box
      link: torso_link
      xyz: [0.0, 0.0, 0.22]
      rpy: [0.0, 0.0, 0.0]
      half_extents: [0.115, 0.075, 0.25]
    - name: head_sphere
      kind: sphere
      link: torso_link
      xyz: [0.015, 0.0, 0.53]
      radius: 0.16
  chains:
    right_arm:
      shapes:
        - name: upper_arm
          kind: capsule
          a:
            link: right_shoulder_yaw_link
            toward: right_elbow_link
            t: 0.2
          b:
            link: right_elbow_link
          radius: 0.055
        - name: forearm
          kind: capsule
          a:
            link: right_elbow_link
          b:
            link: right_wrist_yaw_link
            toward: right_hand_link
            t: 0.75
          radius: 0.045
        # TCP 向法兰盘平面（right_hand_link 原点、法线为其 +x）做垂线，
        # 垂足 → TCP 的粗胶囊：覆盖手掌/手指这段，参与和环境的碰撞
        - name: hand
          kind: capsule
          a:
            tcp_foot:
              link: right_hand_link
              axis: [1, 0, 0]
          b:
            tcp: true
          radius: 0.04
        - name: tcp
          kind: sphere
          tcp: true
          radius: 0.06
    left_arm:
      shapes:
        - name: upper_arm
          kind: capsule
          a:
            link: left_shoulder_yaw_link
            toward: left_elbow_link
            t: 0.2
          b:
            link: left_elbow_link
          radius: 0.055
        - name: forearm
          kind: capsule
          a:
            link: left_elbow_link
          b:
            link: left_wrist_yaw_link
            toward: left_hand_link
            t: 0.75
          radius: 0.045
        - name: hand
          kind: capsule
          a:
            tcp_foot:
              link: left_hand_link
              axis: [1, 0, 0]
          b:
            tcp: true
          radius: 0.04
        - name: tcp
          kind: sphere
          tcp: true
          radius: 0.06
