<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script type="importmap">{"imports":{"three":"/web/vendor/three.module.js"}}</script>
  <style>
    * { box-sizing:border-box; }
    html,body { margin:0;min-height:100%;background:transparent;color:#dce8f4;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; }
    button,select,input { font:inherit; }
    button,select { color:#dce8f4;background:#13263a;border:1px solid #29415a;border-radius:7px; }
    button { height:25px;padding:3px 7px;font-size:10px;line-height:1;white-space:nowrap;cursor:pointer; }
    button:disabled,select:disabled,input:disabled { opacity:.45;cursor:not-allowed; }
    .plan-robot-viewport { width:100%;height:245px;position:relative;border-radius:10px;background:radial-gradient(circle at 50% 40%,#172b3c,#07111d 72%);border:1px solid rgba(41,59,80,.8);overflow:hidden; }
    .plan-robot-viewport canvas { display:block;width:100%;height:100%; }
    .plan-placeholder { position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8fa3b9;font-size:11px;pointer-events:none;z-index:2;padding:20px; }
    .plan-replay-controls { display:grid;grid-template-columns:auto auto auto auto minmax(45px,1fr) auto;gap:4px;align-items:center;margin-top:7px; }
    .collision-toggle,.speed-control { display:flex;align-items:center;gap:3px;color:#8fa3b9;font-size:9px;white-space:nowrap; }
    .collision-toggle input { width:12px;height:12px;margin:0; }
    .speed-control select { width:52px;height:25px;padding:2px 4px;font-size:9px; }
    input[type="range"] { width:100%;accent-color:#43d6c5; }
    #planFrameLabel { color:#8fa3b9;font-size:9px;white-space:nowrap; }
  </style>
</head>
<body>
  <div id="planRobotViewport" class="plan-robot-viewport">
    <div id="planRobotPlaceholder" class="plan-placeholder">在线规划成功后加载机器人轨迹</div>
  </div>
  <div class="plan-replay-controls">
    <button id="planReplayBtn" disabled>▶ 播放</button>
    <button id="planResetViewBtn" disabled>复位</button>
    <label class="collision-toggle"><input id="planShowCollisions" type="checkbox" />碰撞体</label>
    <label class="speed-control">速度<select id="planPlaybackSpeed" disabled><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option><option value="5">5×</option></select></label>
    <input id="planFrameSlider" type="range" min="0" max="0" value="0" disabled />
    <span id="planFrameLabel">0 / 0</span>
  </div>
  <script type="module" src="/web/gravity-plan-inline.js?v=20260822-1"></script>
</body>
</html>
