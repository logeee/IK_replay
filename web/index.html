<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>双臂 IK 调试回放台</title>
    <link rel="stylesheet" href="/web/style.css?v=63" />
    <script type="importmap">
      {
        "imports": {
          "three": "/web/vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <aside id="leftArmPanel" class="control-panel arm-panel left"></aside>

      <section class="viewer-panel">
        <header class="viewer-header">
          <div>
            <h1>双臂 IK 调试回放台</h1>
            <span id="robotName">-</span>
          </div>
          <label class="robot-picker">
            <span>URDF / 机器人</span>
            <select id="robotSelect"></select>
          </label>
        </header>
        <div id="viewport" class="viewport"></div>

        <div id="reachPanel" class="reach-panel hidden">
          <header class="reach-header">
            <strong>点击取目标 → IK 预演 → 真机执行</strong>
            <span id="reachBadge" class="reach-badge">-</span>
            <button id="reachCollapseBtn" type="button" title="收起/展开">—</button>
          </header>
          <div id="reachBody" class="reach-body">
            <div class="reach-video-col">
              <div class="reach-video-wrap">
                <img id="reachVideo" alt="camera" />
                <div id="reachMark" class="reach-mark hidden"></div>
              </div>
              <div class="reach-video-btns">
                <div class="reach-pick-actions">
                  <button id="reachFullscreenBtn" type="button">全屏选点</button>
                  <button id="reachPointcloudBtn" type="button"
                          title="冻结同帧 RGB-D，可在 RGB 或点云中选点并用 WASDQE 微调">点云选点 ↗</button>
                  <a class="reach-perp-link" href="/web/perp.html" target="_blank"
                     title="柜面法向 / 垂直指标实时观测 + 腰 yaw 点动">垂直度调试 ↗</a>
                </div>
                <div class="reach-goto-actions">
                  <select id="reachGotoSel" hidden
                          title="当前选中的路点终点">
                    <option value="">（路点终点）</option>
                  </select>
                  <button id="reachGotoPickBtn" type="button"
                          title="按左 / 右 / 其他分类，并按距离选择路点终点">选择路点终点…</button>
                  <button id="reachGotoBtn" type="button"
                          title="从当前姿态直接运动到选中路点（关节插值，无 IK）">▶ 前往</button>
                </div>
              </div>
            </div>
            <div class="reach-side">
              <div id="reachInfo" class="reach-info">在左侧相机画面中点击目标</div>
              <div class="reach-offset-row">
                <label class="reach-offset">
                  <span>接近偏移(m)</span>
                  <input id="reachOffset" type="number" step="0.005" min="-0.05" value="0" />
                </label>
                <label class="reach-offset">
                  <span>时长(s)</span>
                  <input id="reachDuration" type="number" step="1" min="1" value="6" />
                </label>
                <label class="reach-offset">
                  <span>左移(cm)</span>
                  <input id="reachStepLen" type="number" step="1" value="6" />
                </label>
                <label class="reach-offset">
                  <span>推力(N)</span>
                  <input id="reachPushForce" type="number" step="1" min="0" max="40" value="25" />
                </label>
                <label class="reach-offset" title="仅左侧规划：平移段多抬这么高，进给段从上前方斜切入目标——抵消运动中1~3cm的跟踪下垂，目标贴着障碍下表面时不会从下面钻进去刮底。0 关闭">
                  <span>中段抬高(cm)</span>
                  <input id="reachLiftCm" type="number" step="0.5" min="0" value="2" />
                </label>
              </div>
              <div class="reach-actions">
                <button id="reachScanBtn" type="button">扫描障碍</button>
                <button id="reachClearObsBtn" type="button" disabled>清除障碍</button>
              </div>
              <div class="reach-control-group">
                <div class="reach-control-row">
                  <span>经由路点</span>
                  <select id="reachWaypointSel" class="reach-waypoint-sel">
                    <option value="">（直达）</option>
                  </select>
                  <button id="reachAddViaBtn" type="button" title="加入经由队列">＋ 加入</button>
                </div>
                <div class="reach-control-row">
                  <span>结束位点</span>
                  <select id="reachEndSel" class="reach-waypoint-sel">
                    <option value="">（不收回）</option>
                  </select>
                </div>
              </div>
              <div id="reachViaList" class="reach-via-list hidden"></div>
              <div class="reach-control-group reach-sequence-group">
                <div class="reach-sequence-main">
                  <span>动作序列</span>
                  <select id="reachSeqSel" hidden>
                    <option value="">（未选择）</option>
                  </select>
                  <button id="reachSeqPickBtn" type="button"
                          title="按左 / 右 / 其他分类，并按距离选择动作序列">选择动作序列…</button>
                  <button id="reachSeqRunBtn" type="button" disabled
                          title="选择序列并接管手臂后可用">先接管</button>
                </div>
                <div class="reach-sequence-tools">
                  <label title="正=墙向机器人逼近（更保守），负=墙向后退让；只影响重新规划">
                    退让(cm)
                    <input id="reachSeqMargin" type="number" value="1" step="0.5" />
                  </label>
                  <button id="reachSeqSaveBtn" type="button"
                          title="把当前经由队列按顺序存为序列">保存序列</button>
                  <button id="reachSeqDelBtn" type="button" disabled
                          title="删除选中的序列">删除</button>
                </div>
              </div>
              <div class="reach-actions">
                <button id="reachHandMoveBtn" type="button" disabled>卸力摆位</button>
                <button id="reachRecordBtn" type="button" disabled>录制路点</button>
                <button id="reachDelWpBtn" type="button" disabled>删路点</button>
              </div>
              <div class="reach-toggles">
                <label class="reach-stepmode" title="主段到位后暂停，横移/收回需手动点击才继续">
                  <input id="reachStepMode" type="checkbox" />
                  <span>分段模式（到位后暂停）</span>
                </label>
                <label class="reach-stepmode" title="对取点各段做逐帧碰撞检查（较慢）；左侧规划直线撞障时自动改用 RRT 绕障路径，绕不过去才禁止执行。默认关闭">
                  <input id="reachCollisionCheck" type="checkbox" />
                  <span>碰撞检查+RRT绕障</span>
                </label>
              </div>
              <div class="reach-actions">
                <button id="reachArmBtn" type="button" disabled>接管手臂</button>
                <button id="reachReplanBtn" type="button" disabled
                        title="现有逻辑：数值 IK 解到目标 + 直线/经由路点规划">右侧规划</button>
                <button id="reachPlanLeftBtn" type="button" disabled
                        title="平移在先、进出在后：先竖直+水平对齐到目标正前方（保持当前深度），最后一段才沿机器人前后方向往里伸；往外拔则先拔出到目标深度再平移">左侧规划</button>
                <button id="reachExecBtn" type="button" class="danger" disabled>真机执行</button>
                <button id="reachStopBtn" type="button" class="danger" disabled>急停</button>
              </div>
              <div id="reachMsg" class="reach-msg"></div>
              <div id="reachDiag" class="reach-diag hidden"></div>
            </div>
          </div>
        </div>

        <div id="reachStepNext" class="reach-step-pop hidden">
          <div class="reach-step-pop-title">主段已到位，暂停中</div>
          <div class="reach-step-pop-hint">可先调参数或重新取点，再选择下一步</div>
          <div class="reach-step-pop-actions">
            <button id="reachNextSideBtn" type="button" class="primary">继续横移</button>
            <button id="reachNextSideRBtn" type="button"
                    title="与左移逻辑完全对称：同样的距离与贴面方向，符号取反">继续反向横移</button>
            <button id="reachNextPickBtn" type="button"
                    title="在画面里再点一个点，从当前姿态直接规划过去（不经过经由路点），到位后回到本弹窗">再次选点</button>
            <button id="reachNextReturnBtn" type="button">收回到结束位点</button>
            <button id="reachNextDoneBtn" type="button" class="ghost">结束</button>
          </div>
        </div>

        <div id="reachLibraryModal" class="reach-library-modal hidden"
             role="dialog" aria-modal="true" aria-labelledby="reachLibraryTitle">
          <div class="reach-library-card">
            <div class="reach-library-header">
              <strong id="reachLibraryTitle">选择项目</strong>
              <button id="reachLibraryCloseBtn" type="button" aria-label="关闭">×</button>
            </div>
            <div class="reach-library-fields">
              <label>
                <span>动作方向</span>
                <select id="reachLibraryGroup">
                  <option value="left">左</option>
                  <option value="right">右</option>
                  <option value="other">其他</option>
                </select>
              </label>
              <label>
                <span>距离 / 名称</span>
                <select id="reachLibraryItem"></select>
              </label>
            </div>
            <div id="reachLibraryHint" class="reach-library-hint"></div>
            <div class="reach-library-actions">
              <button id="reachLibraryCancelBtn" type="button">取消</button>
              <button id="reachLibraryConfirmBtn" type="button" class="primary">确定选择</button>
            </div>
          </div>
        </div>

        <div id="reachFsOverlay" class="reach-fs-overlay hidden">
          <div class="reach-fs-bar">
            <span>全屏选点：在画面中点击目标，确认后自动退出全屏（Esc 取消）</span>
            <button id="reachFsCloseBtn" type="button">× 退出</button>
          </div>
          <div class="reach-fs-stage">
            <img id="reachFsVideo" alt="camera fullscreen" />
            <div id="reachFsMark" class="reach-mark hidden"></div>
          </div>
        </div>

        <div class="viewer-topbar">
          <span id="stateLabel">就绪</span>
          <span id="frameLabel">左 0/0 | 右 0/0</span>
          <button id="resetViewButton" class="topbar-button" type="button">视角复位</button>
          <button id="targetMoveButton" class="topbar-button active" type="button">移动目标</button>
          <button id="targetRotateButton" class="topbar-button" type="button">旋转目标</button>
        </div>
      </section>

      <aside id="rightArmPanel" class="control-panel arm-panel right"></aside>
    </main>

    <script type="module" src="/web/main.js?v=87"></script>
  </body>
</html>
